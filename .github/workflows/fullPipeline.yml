name: Deploy Laravel Backend

# Trigger the workflow when there is a push to the "12.x" branch
on:
  push:
    branches: [ "12.x" ]

jobs:
  deploy:
    # Run the deployment job on the latest Ubuntu GitHub Actions runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code so workflow can access deploy scripts
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Upload the deployment script to the remote EC2 instance
      - name: Upload deploy script
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.BACKEND_HOST }}       # IP address or hostname of EC2 instance
          username: ${{ secrets.BACKEND_USER }}   # EC2 username (e.g., ubuntu)
          key: ${{ secrets.BACKEND_SSH_KEY }}     # SSH private key stored as GitHub Secret
          source: "deploy.sh"                     # Local deploy script to copy
          target: "/home/${{ secrets.BACKEND_USER }}/" # Destination path on EC2

      # Step 3: Connect via SSH to the EC2 instance and run the deployment script
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.BACKEND_HOST }}       # EC2 IP address or hostname
          username: ${{ secrets.BACKEND_USER }}   # EC2 user
          key: ${{ secrets.BACKEND_SSH_KEY }}     # SSH private key
          script: |
            # Make the deploy script executable
            chmod +x ~/deploy.sh
            # Execute the deployment script with sudo (if required)
            sudo ~/deploy.sh
